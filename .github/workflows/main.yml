name: morning

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印不发送（默认 true；正式发送请填 false）'
        required: false
        default: 'true'

jobs:
  send_message:
    runs-on: ubuntu-latest
    name: send morning to your girlfriend

    steps:
    - name: checkout
      uses: actions/checkout@v3
      with:
        ref: master

    - name: sender
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
        architecture: 'x64'
    - run: python ./main.py
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
        USER_ID: ${{ secrets.USER_ID }}
        CITY: ${{ secrets.CITY }}
        HEFENG_KEY: ${{ secrets.HEFENG_KEY }}
        TIAN_KEY: ${{ secrets.TIAN_KEY }}
        START_DATE: ${{ secrets.START_DATE }}
        JINGJING_BIRTHDAY: ${{ secrets.JINGJING_BIRTHDAY }}
        LUCKY_TEXT: ${{ secrets.LUCKY_TEXT }}
        LIZHI_TEXT: ${{ secrets.LIZHI_TEXT }}
        PIPI_TEXT: ${{ secrets.PIPI_TEXT }}
        TIANQI_TEXT: ${{ secrets.TIANQI_TEXT }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
